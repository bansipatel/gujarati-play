<!doctype html>

<body>

      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7v8.5a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></symbol>

      <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="m14 7 3 3"/></symbol>

      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>

      <a href="#/summary" data-route="summary"><svg class="ic"><use href="#i-chart"/></svg><span>Summary</span></a>
      <a href="#/lessons" data-route="lessons"><svg class="ic"><use href="#i-book"/></svg><span>Lessons</span></a>
      <a href="#/practice" data-route="practice"><svg class="ic"><use href="#i-play"/></svg><span>Practice</span></a>
      <a href="#/write" data-route="write"><svg class="ic"><use href="#i-pen"/></svg><span>Write</span></a>
      <a href="#/alphabet" data-route="alphabet"><svg class="ic"><use href="#i-grid"/></svg><span>Alphabet</span></a>
      <a href="#/settings" data-route="settings"><svg class="ic"><use href="#i-sliders"/></svg><span>Settings</span></a>
      <button type="button" id="fs-btn" class="nav-btn" hidden aria-pressed="false"><svg class="ic"><use href="#i-expand"/></svg><span>Full screen</span></button>
    </nav>

    <div class="col">
      <header class="top">
        <a class="wordmark" href="#/"><span class="gu" lang="gu">અક્ષર</span> Akshar</a>
        <div class="hud" aria-live="polite"><span id="hud-avatar" class="avatar" aria-hidden="true" hidden></span><div class="hud-text"><span id="hud-name" class="hud-name" hidden></span><span id="hud-level"></span><span id="hud-points" class="pts"></span></div></div>

      <main id="app" tabindex="-1">

      </main>
      <footer id="foot">Progress is saved only in this browser. <a href="#/settings">Back it up</a> before clearing site data.</footer>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg" aria-modal="true"></dialog>

  <script src="js/data/items.js"></script>

  <script src="js/games.js"></script>
  <script src="js/shape.js"></script>
  <script src="js/writing.js"></script>
  <script src="js/app.js"></script>

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
